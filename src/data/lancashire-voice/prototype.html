<title>Lancashire Voice: prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* A calm civic product: a numbered journey across the top, one task per screen, and a results dashboard
   built like a real one. Chart colours are the validated categorical slots (channels) and the blue/red
   diverging pair with a grey midpoint (agree/pass/disagree), stepped separately for light and dark. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#E8ECF0; --ink:#14202B; --muted:#55626F; --line:#D3D9E0; --line-strong:#B9C2CC;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#E3EEFB;
  --warn:#9A6212; --warn-soft:#FBF0DC; --good:#1E7B4F; --good-soft:#DFF2E7; --rose:#B3122E; --rose-soft:#F8E1E5;
  --s-verified:#2a78d6; --s-panel:#eb6834; --s-open:#1baf7a;
  --d-agree:#2a78d6; --d-pass:#C9CED4; --d-disagree:#e34948;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F29; --sunk:#1F2A35; --ink:#E8EDF2; --muted:#9DA9B5; --line:#2B3845; --line-strong:#3A4957;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16263A;
  --warn:#E3AA4F; --warn-soft:#33270F; --good:#5FC793; --good-soft:#132B21; --rose:#F0607A; --rose-soft:#3A1C24;
  --s-verified:#3987e5; --s-panel:#d95926; --s-open:#199e70;
  --d-agree:#3987e5; --d-pass:#4A5562; --d-disagree:#e66767;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F29; --sunk:#1F2A35; --ink:#E8EDF2; --muted:#9DA9B5; --line:#2B3845; --line-strong:#3A4957;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16263A;
  --warn:#E3AA4F; --warn-soft:#33270F; --good:#5FC793; --good-soft:#132B21; --rose:#F0607A; --rose-soft:#3A1C24;
  --s-verified:#3987e5; --s-panel:#d95926; --s-open:#199e70;
  --d-agree:#3987e5; --d-pass:#4A5562; --d-disagree:#e66767;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 80px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.02;letter-spacing:.01em}
h1{font-size:clamp(2.8rem,9vw,5.2rem);font-weight:900;text-transform:uppercase}
h2{font-size:clamp(1.9rem,5vw,2.7rem);font-weight:800;text-transform:uppercase}
h3{font-size:1.25rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
p{margin:0;max-width:70ch}
ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
cite{font-style:normal;color:var(--muted);font-size:.86em}
a{color:var(--accent-ink)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 .72rem/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.875rem} .mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font:700 1rem/1 var(--f-body);padding:14px 20px;border-radius:999px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:9px 14px;font-size:.9rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* banner and shell */
.proto{background:var(--warn-soft);border-bottom:1px solid var(--warn);padding:9px 16px;font-size:.86rem}
.proto .in{max-width:1120px;margin:0 auto;display:flex;gap:10px;align-items:baseline}
.proto b{color:var(--warn);text-transform:uppercase;letter-spacing:.12em;font-size:.7rem;flex:0 0 auto}
.shell{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.shell .in{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:20px;min-height:60px}
.brand{font:900 1.4rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;background:none;border:0;padding:0}
.brand i{font-style:normal;color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;justify-content:flex-end}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:999px;padding:8px 12px;font:600 .9rem/1 var(--f-body);color:var(--muted);white-space:nowrap}
.tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:600 .72rem/1 var(--f-data)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs button.done .n{background:var(--good);border-color:var(--good);color:#fff}
@media (max-width:760px){.shell .in{flex-wrap:wrap;gap:0;padding-top:10px}.brand{width:100%}.tabs{flex:1 1 100%;justify-content:flex-start;padding:8px 0}}

section{padding-block:36px 8px}
.lede{font-size:1.12rem;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.notice{border-left:5px solid var(--accent);background:var(--accent-soft);box-shadow:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.grid2>*,.grid3>*{min-width:0}
.nextrow{display:flex;justify-content:flex-end;padding-top:22px;border-top:1px solid var(--line);margin-top:26px}

/* home */
.hero{display:grid;gap:22px;padding-block:44px 8px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;counter-reset:s}
.step{position:relative;padding:20px 20px 20px 66px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.step:hover{border-color:var(--line-strong)}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:18px;top:18px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 1rem/1 var(--f-data)}
.step b{display:block;font:800 1.15rem/1.1 var(--f-display);text-transform:uppercase;margin-bottom:4px}
.step span{font-size:.92rem;color:var(--muted)}
.layer{border-top:4px solid var(--accent)}
.layer.verified{border-top-color:var(--ink)} .layer.panel{border-top-color:var(--s-panel)}
.feedback{border-left:5px solid var(--good);background:var(--good-soft);box-shadow:none}

/* take part */
.stmt{display:grid;gap:20px;text-align:center;padding:34px 22px}
.stmt q{font:800 clamp(1.6rem,4.6vw,2.3rem)/1.15 var(--f-display);quotes:"\201C" "\201D"}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:540px;margin:0 auto;width:100%}
.votes button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:14px 6px;font-weight:700}
.votes .a{border-color:var(--d-agree);color:var(--d-agree)} .votes .d{border-color:var(--d-disagree);color:var(--d-disagree)}
.votes button:hover{background:var(--sunk)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.tally b{display:block;font:900 2.4rem/1 var(--f-display)}
.mylist{list-style:none;padding:0;gap:8px}
.mylist li{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:.93rem;align-items:baseline}
.tag{font:700 .7rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:999px;text-align:center}
.tag.agree{background:var(--accent-soft);color:var(--accent-ink)} .tag.disagree{background:var(--rose-soft);color:var(--rose)} .tag.pass{background:var(--sunk);color:var(--muted)}

/* vote */
.codebox input{font:600 1.3rem/1 var(--f-data);letter-spacing:.08em;padding:14px;border:2px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);width:100%;max-width:360px;text-transform:uppercase}
.msg{font-size:.92rem} .msg.ok{color:var(--good)} .msg.bad{color:var(--rose)}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px}
.choice b{display:block;font:800 1.35rem/1.1 var(--f-display);text-transform:uppercase}
.choice[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.q{font:800 clamp(1.45rem,4vw,2rem)/1.15 var(--f-display)}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:600}
details p{margin-top:6px}
.locked{opacity:.45;pointer-events:none}

/* dashboard */
.simbanner{display:flex;gap:10px;align-items:center;background:repeating-linear-gradient(135deg,var(--warn-soft) 0 12px,transparent 12px 24px),var(--surface);border:1.5px dashed var(--warn);border-radius:var(--r);padding:12px 16px;font-weight:600;font-size:.92rem}
.simbanner b{color:var(--warn);text-transform:uppercase;letter-spacing:.12em;font-size:.72rem}
.dash{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.dash{grid-template-columns:minmax(0,1fr)}}
.settings{position:sticky;top:84px;display:grid;gap:16px}
@media (max-width:900px){.settings{position:static}}
.ctrl{display:grid;gap:6px}
.ctrl label,.ctrl .lab{font-weight:600;font-size:.9rem}
.ctrl output{font:600 1.15rem/1 var(--f-data)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dashmain{display:grid;gap:20px}
.qhead{display:grid;gap:6px}
.qhead .q{font-size:clamp(1.25rem,3vw,1.6rem)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px;box-shadow:var(--shadow);border-top:4px solid var(--line-strong)}
.kpi.verified{border-top-color:var(--s-verified)} .kpi.panel{border-top-color:var(--s-panel)} .kpi.open{border-top-color:var(--s-open)}
.kpi .v{font:900 2.2rem/1 var(--f-display)}
.kpi .v small{font:600 .9rem var(--f-data);color:var(--muted);margin-left:4px}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.panelcard{position:relative}
.panelcard>h3{padding-right:100px}
.stamp{position:absolute;top:16px;right:16px;font:700 .66rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--warn);border:1.5px solid var(--warn);padding:4px 7px;border-radius:999px;background:var(--surface)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:500 11px var(--f-data)}
.chart .rowlab{fill:var(--ink);font:600 13px var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.chart .val{fill:var(--ink);font:600 13px var(--f-data)}
.chart .truth{stroke:var(--ink);stroke-width:2}
.chart .truthlab{fill:var(--ink);font:600 11px var(--f-body)}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent}
.chart .whisk{stroke-width:2;stroke-linecap:round}
.chart .line{fill:none;stroke:var(--s-verified);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--s-verified);opacity:.1}
.chart .rem{stroke:var(--muted);stroke-width:1}
.chart .remlab{fill:var(--muted);font:500 11px var(--f-body)}
.chart .cross{stroke:var(--muted);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.sq{border-radius:2px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font:500 .82rem/1.4 var(--f-body);padding:7px 10px;border-radius:6px;z-index:20;max-width:260px}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.hbar .track{position:relative;height:14px}
.hbar .ghost{position:absolute;inset:0 auto 0 0;background:var(--sunk);border-radius:0 4px 4px 0}
.hbar .fill{position:absolute;inset:0 auto 0 0;background:var(--s-verified);border-radius:0 4px 4px 0;min-width:2px}
.hbar .num{font-family:var(--f-data);font-size:.82rem;white-space:nowrap;text-align:right}
@media (max-width:560px){.hbar{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.hbar>span:first-child{flex:1 1 auto}.hbar .num{flex:0 0 auto}.hbar .track{flex:1 1 100%;order:3}}
.div{display:grid;gap:14px}
.divrow{display:grid;gap:5px}
.divrow .stxt{font-size:.92rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.divbar{display:flex;height:16px;gap:2px}
.divbar span{display:block;height:100%}
.divbar .d{background:var(--d-disagree);border-radius:4px 0 0 4px}
.divbar .p{background:var(--d-pass)}
.divbar .a{background:var(--d-agree);border-radius:0 4px 4px 0}
.divnums{display:flex;justify-content:space-between;font:500 .78rem var(--f-data);color:var(--muted)}
.pill{font:700 .66rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.wait{background:var(--warn-soft);color:var(--warn)} .pill.no{background:var(--sunk);color:var(--muted)}
.pill.shared{background:var(--accent-soft);color:var(--accent-ink)}
.funnel{display:flex;height:22px;gap:2px;border-radius:6px;overflow:hidden}
.funnel span{display:block;height:100%}
.f-valid{background:var(--s-open)} .f-dup{background:var(--d-pass)} .f-auto{background:var(--d-disagree)}
.yours{display:grid;gap:8px;font-size:.92rem}
.yours .chips{display:flex;flex-wrap:wrap;gap:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-family:var(--f-data);white-space:nowrap}
.status{font:700 .72rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.status.Changed{background:var(--accent-soft);color:var(--accent-ink)} .status.Adopted{background:var(--good-soft);color:var(--good)} .status.Not{background:var(--rose-soft);color:var(--rose)}
.example{border:2px dashed var(--line-strong);box-shadow:none}
.tablewrap{overflow-x:auto}
@media (max-width:600px){
  .tablewrap thead{display:none}
  .tablewrap tr{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
  .tablewrap td{border:0;padding:0}
  .tablewrap td:first-child{font-weight:700}
  .tablewrap tr:first-child{border-top:0}
}

/* opinion map: groups use categorical slots 7, 4 and 5 (violet, yellow, magenta), validated light and dark */
:root{--g-A:#6250d6;--g-B:#eda100;--g-C:#e87ba4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-A:#9085e9;--g-B:#c98500;--g-C:#d55181}}
:root[data-theme="dark"]{--g-A:#9085e9;--g-B:#c98500;--g-C:#d55181}
.map{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.map{grid-template-columns:minmax(0,1fr)}}
.map svg{display:block;width:100%;height:auto;background:var(--bg);border-radius:8px}
.map circle.p{stroke:var(--bg);stroke-width:1.5;transition:opacity .25s}
.map circle.p.dim{opacity:.12}
.map .glab{font:800 15px var(--f-display);text-transform:uppercase;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchips button{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:600;font-size:.85rem}
.gchips button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.gchips i{width:10px;height:10px;border-radius:50%;display:inline-block}
.gcard{border-left:5px solid var(--line-strong);padding:12px 14px;background:var(--bg);border-radius:8px;display:grid;gap:6px}
.gcard.A{border-left-color:var(--g-A)} .gcard.B{border-left-color:var(--g-B)} .gcard.C{border-left-color:var(--g-C)}
.gcard .size{font:900 1.8rem/1 var(--f-display)}
.gcard ul{font-size:.88rem}
.mini{list-style:none;padding:0;display:grid;gap:8px}
.mini li{display:grid;gap:4px;font-size:.88rem}
.mini .gbars{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mini .gbars span{display:block;height:8px;border-radius:0 4px 4px 0;background:var(--sunk);position:relative;overflow:hidden}
.mini .gbars span i{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0}
/* tracker */
.tsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.titem{display:grid;gap:10px}
.titem>.eyebrow{padding-right:96px}
.titem .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.titem .dec{font:800 1.2rem/1.15 var(--f-display);text-transform:uppercase}
.prog{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.prog i.done{background:var(--good)} .prog i.declined{background:var(--muted)}
.st{font:700 .7rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap}
.st.planned{background:var(--sunk);color:var(--muted)} .st.progress{background:var(--accent-soft);color:var(--accent-ink)}
.st.done{background:var(--good-soft);color:var(--good)} .st.declined{background:var(--rose-soft);color:var(--rose)}
.tl{list-style:none;padding:0 0 0 14px;margin:0;border-left:2px solid var(--line);display:grid;gap:6px;font-size:.88rem}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl b{font-family:var(--f-data);font-weight:600;margin-right:6px}
footer{margin-top:44px;border-top:3px solid var(--ink);padding-top:18px;display:grid;gap:12px}
footer ol{margin:8px 0 0;padding-left:1.2em;display:grid;gap:6px;font-size:.84rem;overflow-wrap:anywhere}
footer td{font-size:.84rem}
footer td:first-child{font-family:var(--f-data);white-space:nowrap}
.imprint{display:grid;gap:4px;margin-top:6px}
.imprint .src{font-size:.8rem;color:var(--muted)}
</style>

<div class="proto" role="note"><div class="in"><b>Prototype</b><span id="banner"></span></div></div>

const PROTO = {"meta": {"accessed": "5 November 2026", "survey_url": "https://www.lancashire.gov.uk/council/finance/planning-the-councils-budget/", "example_code": "LV48 2173 9065", "contact": "__CONTACT_EMAIL__"}, "words": {"name": "Lancashire Voice", "strap": "A prototype: how Lancashire could ask every resident, count properly and publish the answer.", "banner": "Built by Tom Pickup for his own website. Not a council service: no decision has been made about it. Nothing you enter is collected, stored or sent.", "tabs": ["Home", "Take part", "Vote", "Results", "What changed", "How it works"], "home": {"lede": "A standing way for Lancashire to ask its residents, count the answers properly and publish what changed. This prototype walks through it using the mayoral question as the example, then shows what the results could look like once thousands have taken part.", "about_title": "What this page is", "about": ["A clickable prototype of a platform idea put to the county council's informal Cabinet in November. The council has not decided anything about it.", "Everything happens in your browser. No answer, code or click is recorded, and it all disappears when you close the page.", "The statements and the question are examples written for the prototype. There are no real results here."], "survey": "If you want to have your say on the county council's real budget, its own survey is open until 2 December 2026 <cite>(Lancashire County Council, 2026b)</cite>.", "survey_link": "Go to the council's budget survey", "layers_title": "Three ways in, counted separately", "layers": [{"id": "open", "label": "Open channel", "body": "Anyone can vote on short statements and add their own. Good for ideas and for seeing where people agree. Reported as self selecting, because it is."}, {"id": "verified", "label": "Verified question", "body": "Each elector would get one code, checked against the register, for the headline question. Turnout would be reported against the register, as a referendum would be."}, {"id": "panel", "label": "Random panel", "body": "Residents chosen at random and invited by post, weighted to the census, so the result carries a margin of error."}], "start": "Start the demo", "results_cta": "Jump to the results", "steps_title": "How the demo works", "steps": [{"title": "Take part", "body": "Vote agree or disagree on short statements, as anyone could on the open channel."}, {"title": "Vote", "body": "Use an example code to answer the headline question once, as every elector could."}, {"title": "Results", "body": "See a full results dashboard, with simulated data you control."}, {"title": "What changed", "body": "See how every theme residents raise gets a decision and a reason."}]}, "open": {"eyebrow": "Open channel · statement voting", "title": "Example topic: a mayor for Lancashire", "lede": "Vote on each statement. Statements here are examples written for the prototype; on the real platform residents write them.", "agree": "Agree", "disagree": "Disagree", "pass": "Pass", "statements": ["A mayor would give Lancashire a stronger voice with government.", "The cost of a mayor's office would be better spent on services.", "Whoever runs it, buses should be the first thing sorted out.", "Big decisions should rest with a group of council leaders, not one person.", "Residents should get a binding vote before any change.", "I want more local say over transport, skills and investment.", "A mayor would be too far away from towns like mine.", "Whatever is decided, the council should publish what residents said and what it changed."], "add": "Add your own statement", "add_note": "On the real platform you could write one, checked for duplicates and abuse before others see it. The prototype has no text box, so nothing you write can be collected.", "done_title": "Your votes", "map_title": "Where opinion sits", "map": "With real participants this panel groups people who vote alike, shows what divides the groups, and picks out the statements most groups agree on. That shared ground is often the most useful result. There is nothing to show here because no one else's votes exist.", "next": "Next: vote"}, "verified": {"eyebrow": "Verified question · example", "title": "One answer per elector", "lede": "On the real platform, every elector would get a unique code by post. The code would be checked against the electoral register, which a council may use “for the purposes of a poll under section 116 (local polls) of the Local Government Act 2003” <cite>(Representation of the People (England and Wales) Regulations 2001, reg. 107)</cite>.", "code_label": "Your code", "code_help": "Nothing you type here leaves the page. Use the example code to carry on.", "use_example": "Use the example code", "check": "Check code", "bad_code": "That is not the example code. Real codes would be checked against the register; this prototype only knows its example.", "ok_code": "Example code accepted. On the real platform this would be matched to the register and could be used once.", "question": "Should Lancashire have a directly elected mayor, leading a combined authority with Blackburn with Darwen and Blackpool?", "options": [{"id": "yes", "label": "Yes", "body": "A directly elected mayor leads the combined authority, with whatever powers a mayoral deal brings."}, {"id": "no", "label": "No", "body": "The combined authority carries on as now, led jointly by its member councils, with no mayor."}], "before_title": "Before you answer", "before_note": "The law expects people to see the realistic alternatives and the reasons, not only a yes or no: “fairness will require that interested persons be consulted not only upon the preferred option but also upon arguable yet discarded alternative options.” <cite>(R (Moseley) v Haringey LBC, 2014)</cite>. The four sections below were written for this prototype from published law and government documents. They are not the council's evidence pack, and they do not speak for the council.", "before": [{"title": "What a mayor would and would not control", "body": ["The law lists the subjects a strategic authority can cover, its areas of competence: “(a) transport and local infrastructure; (b) skills and employment support; (c) housing and strategic planning; (d) economic development and regeneration; (e) the environment and climate change; (f) health, well-being and public service reform; (g) public safety; (h) culture; (i) rural affairs and coastal communities.” <cite>(English Devolution and Community Empowerment Act 2026, s.2)</cite>", "Which of these a Lancashire mayor would hold depends on the devolution agreement. It has not been published. The Budget says “The government is now in the final stages of agreeing 10 new devolution agreements: Mayoral Strategic Authorities for Devon, Plymouth and Torbay; Hertfordshire; Lancashire;” <cite>(HM Treasury, 2026, chapter 5)</cite>", "Until the agreement is published, nobody can list exactly what a mayor would and would not control. On the real platform this section would set it out line by line."]}, {"title": "What it costs and who pays", "body": ["The law allows a mayor's costs to be paid through council tax: “The Secretary of State may by regulations make provision for the costs of a mayor for the area of a CCA that are incurred in, or in connection with, the exercise of mayoral functions to be met from precepts issued by the CCA” <cite>(Levelling-up and Regeneration Act 2023, s.41)</cite>. That means an extra charge on council tax bills, called a precept.", "No government document has yet set a figure for investment in a Lancashire mayoral authority. Figures reported in the press were not commitments, so none is shown here.", "Nationally, the Budget includes “Providing an uplift to capacity and capability funding directly to Strategic Authorities, worth £150 million in 2027-28.” <cite>(HM Treasury, 2026, chapter 5)</cite>", "The running cost of a Lancashire mayor's office has not been published."]}, {"title": "The council's view and the alternatives it considered, with reasons", "body": ["The county council has not set out a view on a mayor, and this prototype does not speak for it.", "On the real platform this section would give the council's view, every realistic alternative including no change, and the reasons for and against each, written and checked before the question opens."]}, {"title": "What happens if the answer is no", "body": ["No vote binds anyone. Regulations for a mayor need written consent: “the regulations have been consented to in writing by each constituent council and the CCA.” <cite>(Levelling-up and Regeneration Act 2023, s.28)</cite>", "So the answer would inform whether the councils give that consent. On the real platform this section would set out exactly what a no changes, checked by the council's Monitoring Officer first."]}], "submit": "Try an answer", "thanks": "Answer held in this browser tab only. On the real platform it would be counted once and stored apart from your code, so it could not be traced to you.", "turnout_title": "How the count works", "turnout": ["Turnout would be reported against all 917,889 electors on the county register <cite>(ONS, 2024)</cite>, as a referendum would be.", "Paper and phone answers would count the same way.", "A record of the count would be published after close, so anyone could check the total."], "codes_title": "How the codes arrive", "codes": ["A letter to every address, with a code for each elector there: £370,055 to £423,418 for the 580,024 dwellings on the valuation list, at GOV.UK Notify's economy and second class rates <cite>(GOV.UK Notify, 2026)</cite>.", "Or printed on poll cards, which the districts already post: about £55,073 of print <cite>(Bath and North East Somerset Council, 2026)</cite>, but only electors in wards holding an election that spring get one.", "Or printed on council tax bills: about £47,332 of print <cite>(Tendring District Council, 2021)</cite>, one code per dwelling rather than per elector."], "next": "Next: results"}, "changed": {"eyebrow": "What changed · example tracker", "title": "From what you said to what happened", "lede": "After close, every theme gets a decision, an owner and progress you can follow, published until it is done. The entries below are made up examples of the format, not decisions.", "rules_title": "The rules it would run on, fixed before any question opens", "rules": ["Every theme gets a decision and a reason, published by a date set before the question opens.", "Free text is sorted into themes with AI help; an officer signs off every theme list and checks a sample, and the prompts are published.", "No figure is published for any group of fewer than five people.", "An arm's length board with members from every party group oversees it."], "next": "Next: how it works", "summary_answered": "themes answered", "summary_done": "done or closed", "status": {"planned": "Planned", "progress": "In progress", "done": "Done", "declined": "Not adopted"}, "owner": "Owner", "updates": "Updates", "example": "Example"}, "how": {"title": "How it works, and what it costs", "law_title": "The law", "law": ["The law says “A local authority may conduct a poll to ascertain the views of those polled about” its services and their cost <cite>(Local Government Act 2003, s.116)</cite>. Nothing in it binds anyone.", "On reorganisation the Secretary of State may implement a proposal or “decide to take no action” <cite>(Local Government and Public Involvement in Health Act 2007, s.7)</cite>. A mayor needs the councils' consent; the law requires that “the regulations have been consented to in writing by each constituent council and the CCA.” <cite>(Levelling-up and Regeneration Act 2023, s.28)</cite>", "So no vote binds anyone. The aim is an answer that is hard to wave away: one per elector, a sample with a margin of error, and a published response."], "objections_title": "Three objections, answered", "objections": [{"q": "Bots and campaigns", "a": "The headline would count only through codes. The open channel would be screened, and the number excluded published."}, {"q": "Only the keen take part", "a": "A random panel, reported with its margin of error. The county ran a citizens' panel before: 56 per cent answered a budget questionnaire in 2003 <cite>(RBA Research, 2003)</cite> and 64 per cent a wave in 2015 <cite>(Lancashire County Council, 2015)</cite>."}, {"q": "The council marks its own homework", "a": "An arm's length board with every party group, and a published response saying what changed."}], "offline_title": "Not only online", "offline": "Paper and phone routes, help in 64 library branches <cite>(Lancashire County Council, 2026c)</cite>, and over 182 parish councils and 19 town councils <cite>(Lancashire County Council, 2024)</cite>.", "cost_title": "Cost, against a poll", "cost_rows": [{"item": "Advisory county wide poll, once", "cost": "£1.33 million to £2.84 million", "src": "917,889 electors at the official cost per elector of the 2021 PCC elections (£1.45) <cite>(Home Office, 2026)</cite> and the 2019 general election (£3.09) <cite>(Cabinet Office, 2020)</cite>"}, {"item": "Codes by post, one letter per address", "cost": "£370,055 to £423,418", "src": "580,024 dwellings <cite>(MHCLG, 2026)</cite> at Notify rates <cite>(GOV.UK Notify, 2026)</cite>"}, {"item": "Codes on poll cards or bills", "cost": "about £47,332 to £55,073 of print", "src": "<cite>(Tendring District Council, 2021)</cite>; <cite>(Bath and North East Somerset Council, 2026)</cite>"}, {"item": "Platform licence", "cost": "£17,995 to £24,995 a year, or nothing for open source", "src": "Citizen Space, area over a million people <cite>(Delib, 2024)</cite>"}, {"item": "Random panel of 1,000, one round", "cost": "£19,667", "src": "at £19.67 an interview, from Greater Manchester's survey contract <cite>(Contracts Finder, 2025)</cite> <cite>(BMG Research, 2025, p. 5)</cite>; margin plus or minus 3.1 points"}], "cost_note": "Staff time, hosti ": "comments", "funnel_title": "Open channel: what was counted", "funnel_lede": "Every response received, and what was excluded before counting. The excluded counts are published.", "funnel_parts": {"valid": "Counted", "duplicates": "Duplicates", "automated": "Automated or bot"}, "panel_title": "Random panel: returns by district", "panel_lede": "A district figure is published only when its margin of error is within 10 points; otherwise it is withheld and the county figure stands. Try a larger panel.", "reported": "Reported", "withheld": "Too few to report", "th_district": "District", "th_returns": "Returns", "th_margin": "Margin", "how_title": "How the simulation works", "how": ["Everything is worked out in advance and shipped with the page; nothing comes from anyone's real answers.", "The panel is a random draw of that size from a population with the support you set. Each run is a different draw.", "Mobilisation is an assumption for illustration: it moves the verified count three points and the open channel fifteen points towards the side that mobilises.", "The open channel is sized like the county wide reorganisation survey, 13,414 responses <cite>(Cratus Group, 2025, p. 3)</cite>. Four in a hundred are shown as duplicates and six in a hundred as automated, for illustration.", "The opinion groups are illustrative: each has a fixed chance of agreeing with each statement, and their sizes follow the open channel's Yes share. The statement chart is built from the same groups, so the two always agree.", "The turnout curve, the statement votes, the theme shares and the district panel returns are illustrative shapes, not estimates of anything real.", "District electorates are real <cite>(ONS, 2024)</cite>; one turnout is applied everywhere."], "next": "Next: what changed", "map_title": "Opinion map: how people group", "map_lede": "Each dot is a participant in the open channel. People who vote alike on the statements sit close together, and the dots fall into groups. With         </div>`).join("")}</div>

    function how() {
      const h = W.how;
      return `<section class="stack"><h2>${h.title}</h2>

        <div class="card stack"><h3>${h.offline_title}</h3><p>${h.offline}</p></div>
        <div class="card stack"><h3>${h.cost_title}</h3><div class="tablewrap"><table><thead><tr><th>Item</th><th>Published cost</th><th>Basis</th></tr></thead><tbody>
          ${h.cost_rows.map(x => `<tr><td>${x.item}</td><td class="mono">${x.cost}</td><td class="small">${x.src}</td></tr>`).join("")}</tbody></table></div>
          <p class="small muted">${h.cost_note}</p></div>
        ${fb()}
        <div class="nextrow"><button class="btn ghost" type="button" data-tab="0">Back to the start</button></div></section>`;

  /* ---------- the dashboard ---------- */
  function current() {
    const st = S.sim, truth = P.truth[st.truth], t = P.turnout[st.turnout], n = P.panel[st.panel];
    return {truth, t, n, r: P.table[`${truth}|${t}|${st.skew}|${n}|${st.draw}`], stm: P.statements[`${truth}|${st.skew}`],
      op: P.opinion[`${truth}|${st.skew}`], line: P.timeline[t], pd: P.panel_districts[`${n}|${st.draw}`], districts: P.districts[t]};
  }
  function ctrl(key, label, list, show) {
    const st = S.sim;
    return `<div class="ctrl"><label for="sim-${key}">${label}</label><output id="out-${key}">${show(list[st[key]])}</output>
      <input id="sim-${key}" type="range" min="0" max="${list.length - 1}" step="1" value="${st[key]}" data-sim="${key}" aria-valuetext="${show(list[st[key]])}"></div>`;
  }
  function trustChart(c, m) {
    const rows = [
      {id: "verified", v: c.r.v_yes, basis: `${fmt(c.r.v_votes)} ${m.verified_basis}`},
      {id: "panel", v: c.r.p_est, moe: c.r.p_moe, basis: `${fmt(c.n)} ${m.panel_basis}`},
      {id: "open", v: c.r.o_yes, basis: `${fmt(c.r.o_received - c.r.o_excluded)} ${m.open_basis}`}];
    const narrow = innerWidth < 600, W0 = narrow ? 340 : 640, L = narrow ? 8 : 160, R = narrow ? 48 : 60, H = narrow ? 60 : 46, top = 34, x = v => L + (W0 - L - R) * v / 100;
    const svg = `<svg viewBox="0 0 ${W0} ${top + H * 3 + 26}" role="img" aria-label="${esc(m.trust_title)}">
      ${[0, 25, 50, 75, 100].map(g => `<line class="grid" x1="${x(g)}" x2="${x(g)}" y1="${top - 6}" y2="${top + H * 3}"/><text class="axis" x="${x(g)}" y="${top + H * 3 + 16}" text-anchor="middle">${g}%</text>`).join("")}
      <line class="truth" x1="${x(c.truth)}" x2="${x(c.truth)}" y1="${top - 14}" y2="${top + H * 3}"/>
      <text class="truthlab" x="${x(c.truth)}" y="${top - 18}" text-anchor="middle">${esc(m.truth_marker)}: ${c.truth}%</text>
      ${rows.map((o, i) => { const y = top + H * i + H / 2, col = `var(--s-${o.id})`;
        const wh = o.moe ? `<line class="whisk" x1="${x(Math.max(0, o.v - o.moe))}" x2="${x(Math.min(100, o.v + o.moe))}" y1="${y}" y2="${y}" stroke="${col}"/>` : "";
        return `<text class="rowlab" x="${narrow ? L : 0}" y="${narrow ? y - 14 : y + 4}">${esc(m.rows[o.id])}</text>${wh}
          <circle class="dot" cx="${x(o.v)}" cy="${y}" r="7" fill="${col}"/><text class="val" x="${W0 - R + 12}" y="${y + 4}">${o.v}%</text>
          <rect class="hit" x="${L}" y="${y - H / 2}" width="${W0 - L - R}" height="${H}" data-tip="${esc(`${m.rows[o.id]}: ${o.v}% Yes${o.moe ? `, plus or minus ${o.moe}` : ""}. ${o.basis}.`)}"/>`; }).join("")}
    </svg>`;
    return `<div class="card stack panelcard chart">${stamp()}<h3>${m.trust_title}</h3><p class="small muted">${m.trust_lede}</p>
      <div class="legend">${rows.map(o => `<span><i style="background:var(--s-${o.id})"></i>${m.rows[o.id]}</span>`).join("")}</div>${svg}
      <p class="small muted">${m.legend_note}</p>
      <details><summary class="small">${m.table_toggle}</summary><table><thead><tr><th>${m.th_channel}</th><th>${m.th_yes}</th><th>${m.th_basis}</th></tr></thead><tbody>
        ${rows.map(o => `<tr><td>${m.rows[o.id]}</td><td class="num">${o.v}%${o.moe ? ` ±${o.moe}` : ""}</td><td>${o.basis}</td></tr>`).join("")}
        <tr><td>${m.truth_marker}</td><td class="num">${c.truth}%</td><td></td></tr></tbody></table></details></div>`;
  }
  function timelineChart(c, m) {
    const narrow = innerWidth < 600, W0 = narrow ? 340 : 640, L = 44, R = 12, T = 18, B = 30, H0 = narrow ? 200 : 230, days = P.days;
    const maxPct = Math.max(5, Math.ceil(100 * c.line[days - 1] / P.electors / 5) * 5);
    const x = d => L + (W0 - L - R) * d / (days - 1), y = v => T + (H0 - T - B) * (1 - (100 * v / P.electors) / maxPct);
    const pts = c.line.map((v, d) => `${x(d).toFixed(1)},${y(v).toFixed(1)}`);
    const ticks = [0, maxPct / 2, maxPct];
    const svg = `<svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="${esc(m.timeline_title)}" data-timeline="1">
      ${ticks.map(tk => { const yy = T + (H0 - T - B) * (1 - tk / maxPct); return `<line class="grid" x1="${L}" x2="${W0 - R}" y1="${yy}" y2="${yy}"/><text class="axis" x="${L - 6}" y="${yy + 4}" text-anchor="end">${tk}%</text>`; }).join("")}
      ${[1, 14, 28, 42].map(d => `<text class="axis" x="${x(d - 1)}" y="${H0 - 10}" text-anchor="middle">${m.day} ${d}</text>`).join("")}
      ${P.reminders.map(d => `<line class="rem" x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${H0 - B}"/><text class="remlab" x="${x(d) + 4}" y="${T + 10}">${esc(m.reminder)}</text>`).join("")}
      <path class="area" d="M${x(0)},${y(0)} L${pts.join(" L")} L${x(days - 1)},${H0 - B} L${x(0)},${H0 - B} Z"/>
      <polyline class="line" points="${pts.join(" ")}"/>
      <circle class="dot" cx="${x(days - 1)}" cy="${y(c.line[days - 1])}" r="5" fill="var(--s-verified)"/>
      <line class="cross" id="tl-cross" x1="0" x2="0" y1="${T}" y2="${H0 - B}" visibility="hidden"/>
      ${c.line.map((v, d) => `<rect class="hit" x="${x(d) - (W0 - L - R) / days / 2}" y="${T}" width="${(W0 - L - R) / days}" height="${H0 - T - B}" data-x="${x(d)}" data-tip="${esc(`${m.day} ${d + 1}: ${fmt(v)} votes, ${pct(v, P.electors)}% of electors`)}"/>`).join("")}
    </svg>`;
    return `<div class="card stack panelcard chart">${stamp()}<h3>${m.timeline_title}</h3><p class="small muted">${m.timeline_lede}</p>${svg}</div>`;
  }
  function districtBars(c, m) {
    const mx = Math.max(...c.districts.map(d => d.electors));
    return `<div class="card stack panelcard">${stamp()}<h3>${m.districts_title}</h3><p class="small muted">${m.districts_lede}</p>
      <div class="hbars">${c.districts.map(d => `<div class="hbar" data-tip="${esc(`${d.name}: ${fmt(d.votes)} votes from ${fmt(d.electors)} electors`)}"><span>${d.name}</span>
        <span class="track"><span class="ghost" style="width:${(100 * d.electors / mx).toFixed(1)}%"></span><span class="fill" style="width:${(100 * d.votes / mx).toFixed(1)}%"></span></span>
        <span class="num">${fmt(d.votes)}</span></div>`).join("")}</div>
      <div class="legend"><span><i class="sq" style="background:var(--sunk)"></i>Electors</span><span><i class="sq" style="background:var(--s-verified)"></i>Votes cast</span></div></div>`;
  }
  function statementBars(c, m) {
    const rows = W.open.statements.map((s, i) => ({s, i, ...c.stm[i]})).sort((a, b) => b.agree - a.agree);
    return `<div class="card stack panelcard">${stamp()}<h3>${m.statements_title}</h3><p class="small muted">${m.statements_lede}</p>
      <div class="legend"><span><i class="sq" style="background:var(--d-disagree)"></i>${m.disagree}</span><span><i class="sq" style="background:var(--d-pass)"></i>${m.pass}</span><span><i class="sq" style="background:var(--d-agree)"></i>${m.agree}</span></div>
      <div class="div">${rows.map(r => `<div class="divrow" data-tip="${esc(`${m.agree} ${r.agree}%, ${m.pass} ${r.pass}%, ${m.disagree} ${r.disagree}%`)}">
        <span class="stxt">${r.s}${P.shared_ground.includes(r.i) ? ` <span class="pill shared">${m.shared}</span>` : ""}</span>
        <span class="divbar"><span class="d" style="width:${r.disagree}%"></span><span class="p" style="width:${r.pass}%"></span><span class="a" style="width:${r.agree}%"></span></span>
        <span class="divnums"><span>${r.disagree}% ${m.disagree.toLowerCase()}</span><span>${r.agree}% ${m.agree.toLowerCase()}</span></span></div>`).join("")}</div></div>`;
  }
  function opinionMap(c, m) {
    const G = ["A", "B", "C"], sel = S.mapGroup, prof = P.group_profile, st = W.open.statements;
    const W0 = 420, H0 = 320, sx = v => W0 / 2 + v * 80, sy = v => H0 / 2 + 10 - v * 80;
    const groups = c.op.groups.split("");
    const dots = groups.map((g, i) => { const [px, py] = P.dot_pos[g][i];
      return `<circle class="p${sel && sel !== g ? " dim" : ""}" cx="${sx(px).toFixed(1)}" cy="${sy(py).toFixed(1)}" r="4.5" fill="var(--g-${g})" data-tip="${esc(`${m.groups[g].name}: ${m.groups[g].desc}`)}"/>`; }).join("");
    const centre = g => { const pts = groups.map((gg, i) => gg === g ? P.dot_pos[g][i] : null).filter(Boolean); if (!pts.length) return null;
      return [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length]; };
    const labels = G.map(g => { const ct = centre(g); return ct ? `<text class="glab" x="${sx(ct[0])}" y="${sy(ct[1]) - 34}" text-anchor="middle">${m.groups[g].name}</text>` : ""; }).join("");
    const top = (g, dir) => prof[g].map((v, i) => ({v, i})).sort((a, b) => dir * (b.v - a.v))[0];
    const show = sel ? [sel] : G;
    const cards = show.map(g => { const a = top(g, 1), d = top(g, -1);
      return `<div class="gcard ${g}"><div class="row" style="justify-content:space-between"><b>${m.groups[g].name}: ${m.groups[g].desc}</b><span class="size mono">${c.op.shares[g]}%</span></div>
        <span class="small muted">${m.group_size}</span>
        ${sel ? `<p class="small"><b>${m.group_agree}:</b> ${st[a.i]} (${a.v}%)</p><p class="small"><b>${m.group_disagree}:</b> ${st[d.i]} (${d.v}% agree)</p>` : ""}</div>`; }).join("");
    const mini = idx => `<ul class="mini">${idx.map(i => `<li><span>${st[i]}</span><span class="gbars">${G.map(g => `<span data-tip="${esc(`${m.groups[g].name}: ${prof[g][i]}% agree`)}"><i style="width:${prof[g][i]}%;background:var(--g-${g})"></i></span>`).join("")}</span></li>`).join("")}</ul>`;
    return `<div class="card stack panelcard">${stamp()}<h3>${m.map_title}</h3><p class="small muted">${m.map_lede}</p>
      <div class="gchips" role="group" aria-label="${esc(m.map_hint)}"><button type="button" data-group="" aria-pressed="${!sel}">${m.all_groups}</button>${G.map(g => `<button type="button" data-group="${g}" aria-pressed="${sel === g}"><i style="background:var(--g-${g})"></i>${m.groups[g].name}</button>`).join("")}</div>
      <div class="map"><div><svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="${esc(G.map(g => `${m.groups[g].name} ${c.op.shares[g]}%`).join(", "))}">${dots}${labels}</svg><p class="small muted" style="margin-top:6px">${m.map_sample} ${m.map_hint}</p></div>
        <div class="stack" style="gap:10px">${cards}</div></div>
      <div class="grid2"><div class="stack" style="gap:8px"><h3 style="font-size:1rem">${m.divides_title}</h3>${mini(P.divides)}</div>
        <div class="stack" style="gap:8px"><h3 style="font-size:1rem">${m.shared_title}</h3>${mini(P.shared_ground)}</div></div>
      <div class="legend">${G.map(g => `<span><i style="background:var(--g-${g})"></i>${m.groups[g].name}</span>`).join("")}</div></div>`;
  }
  function themeBars(m) {
    const mx = Math.max(...P.themes.map(t => t.count));
    return `<div class="card stack panelcard">${stamp()}<h3>${m.themes_title}</h3><p class="small muted">${m.themes_lede} ${fmt(P.comments)} ${m.comments_label}.</p>
      <div class="hbars">${P.themes.map((t, i) => `<div class="hbar" data-tip="${esc(`${t.theme}: ${fmt(t.count)} ${m.comments_label}, ${t.share}%`)}"><span>${t.theme}</span>
        <span class="track"><span class="fill" style="width:${(100 * t.count / mx).toFixed(1)}%;background:var(--s-open)"></span></span>
        <span class="num">${fmt(t.count)} <span class="pill ${i < 4 ? "good" : "wait"}">${i < 4 ? m.signed : m.awaiting}</span></span></div>`).join("")}</div></div>`;
  }
  function funnelBar(m) {
    const f = P.funnel, parts = [["valid", "f-valid"], ["duplicates", "f-dup"], ["automated", "f-auto"]];
    return `<div class="card stack panelcard">${stamp()}<h3>${m.funnel_title}</h3><p class="small muted">${m.funnel_lede}</p>

      <div class="legend">${parts.map(([k, cls]) => `<span><i class="sq ${cls}"></i>${m.funnel_parts[k]} <b class="mono">${fmt(f[k])}</b></span>`).join("")}<span>Received <b class="mono">${fmt(f.received)}</b></span></div></div>`;

  function panelDistricts(c, m) {

  function dashboard() {

            ${kpi("verified", m.kpi.verified, `${c.r.v_yes}%`, m.kpi_verified_sub)}

  /* ---------- shell ---------- */
  function render(focus) {
    $("#tabs").innerHTML = W.tabs.map((t, i) => {
      const step = JOURNEY.indexOf(i), done = (i === 1 && S.votes.length === W.open.statements.length) || (i === 2 && S.submitted);
      return `<button type="button" data-tab="${i}" class="${done ? "done" : ""}" ${i === S.tab ? 'aria-current="page"' : ""}>${step >= 0 ? `<span class="n" aria-hidden="true">${done ? "✓" : step + 1}</span>` : ""}${t}</button>`;
    }).join("");
    const cur = $("#tabs [aria-current]"); if (cur) $("#tabs").scrollLeft = Math.max(0, cur.offsetLeft - 16);
    $("#app").innerHTML = screens[S.tab]();
    if (focus) { window.scrollTo({top: 0}); const h = $("#app h1, #app h2"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({preventScroll: true}); } }
  }
  const refocus = sel => { const el = document.querySelector(sel); if (el) el.focus({preventScroll: true}); };

  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.tab !== undefined) { S.tab = +d.tab; render(true); }
    else if (d.vote) { S.votes.push(d.vote); render(); refocus(S.votes.length < W.open.statements.length ? '[data-vote="agree"]' : '[data-reset]'); }
    else if (d.reset) { S.votes = []; render(); refocus('[data-vote="agree"]'); }
    else if (d.example) { S.code = PROTO.meta.example_code; S.codeOk = true; render(); refocus('[data-answer="yes"]'); }
    else if (d.check) { S.code = $("#code").value.trim(); S.codeOk = S.code.replace(/\s+/g, "").toUpperCase() === PROTO.meta.example_code.replace(/\s+/g, ""); render(); refocus(S.codeOk ? '[data-answer="yes"]' : "#code"); }
    else if (d.answer) { S.answer = d.answer; render(); refocus(`[data-answer="${d.answer}"]`); }
    else if (d.submit) { S.submitted = true; render(); refocus(".msg.ok"); }
    else if (d.group !== undefined) { S.mapGroup = d.group || null; render(); refocus(`[data-group="${d.group}"]`); }
    else if (d.skew) { S.sim.skew = d.skew; render(); refocus(`[data-skew="${d.skew}"]`); }
    else if (d.redraw) { S.sim.draw = (S.sim.draw + 1) % P.draws; render(); refocus("[data-redraw]"); }
  });
  // While dragging, only the label moves; the dashboard redraws when the slider is released (or on each arrow key press).
  const simShow = (k, i) => { const v = P[k][i]; return k === "panel" ? fmt(v) : v + "%"; };
  document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.sim; if (!k) return; const o = document.getElementById("out-" + k); if (o) o.textContent = simShow(k, +e.target.value); });
  document.addEventListener("change", e => { const k = e.target.dataset && e.target.dataset.sim; if (!k) return; S.sim[k] = +e.target.value; render(); refocus(`#sim-${k}`); });
  let wasNarrow = innerWidth < 600;
  addEventListener("resize", () => { const n = innerWidth < 600; if (n !== wasNarrow) { wasNarrow = n; if (S.tab === 3) render(); } });
  // One tooltip for every chart; the turnout chart also gets a crosshair.
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; document.body.appendChild(tip);
  document.addEventListener("pointermove", e => {
    const h = e.target.closest && e.target.closest("[data-tip]"), cross = document.getElementById("tl-cross");
    if (cross) cross.setAttribute("visibility", h && h.dataset.x ? "visible" : "hidden");
    if (!h) { tip.hidden = true; return; }
    if (cross && h.dataset.x) { cross.setAttribute("x1", h.dataset.x); cross.setAttribute("x2", h.dataset.x); }
    tip.textContent = h.getAttribute("data-tip"); tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + "px"; tip.style.top = (e.clientY + 16) + "px";
  });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "code") { const b = $("[data-check]"); if (b) b.click(); } });

  $("#banner").textContent = W.banner;
  $("#brand").innerHTML = W.name.replace(/ (\S+)$/, " <i>$1</i>");
  $("#foot").innerHTML = `<p class="small">${W.footer.about}</p>
    <details><summary class="small">${W.footer.arithmetic}</summary><table><tbody>${PROTO.arithmetic.map(a => `<tr><td>${esc(a.figure)}</td><td>${esc(a.how)} (${esc(a.cite)})</td></tr>`).join("")}</tbody></table></details>
    <details><summary class="small">${W.footer.sources}</summary><ol>${PROTO.sources.map(s => `<li>${esc(s.ref)} Available at: <a href="${esc(s.url)}" rel="noopener" target="_blank">${esc(s.url)}</a> (Accessed ${esc(PROTO.meta.accessed)}).</li>`).join("")}</ol></details>`;
  render();
})();
</script>
