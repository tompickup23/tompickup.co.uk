name: Deploy tompickup.co.uk

# Deploys straight to GitHub Pages from this repo.
#
# It used to build here and push the result into tompickup23/tompickup23.github.io,
# which needed a cross-repo PAT. That token expired on 20 May 2026 and the deploy
# step sat behind `if: false` for months, so every ETL commit reached the repo and
# stopped there while the live site went stale until somebody rsynced by hand.
#
# Pages publishes from this repo now, so the only credential is the GITHUB_TOKEN
# Actions mints per run. Nothing to rotate, nothing to expire, no manual step.

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel: an in-flight deploy that
# is cancelled half way can leave Pages serving a partial build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` carries the prebuild and postbuild guards, so a parked
      # section reaching the routed tree or the output fails here, not in public.
      # The last postbuild guard, scripts/guard-metadata.mjs, prints its counts
      # (titles over 60, descriptions over 160, invitations with a past date) in
      # this step's log, as warning annotations and in the run summary. It warns
      # only; set FAIL_ON_METADATA: '1' under env here to make it fail the build.
      - name: Build Astro
        run: npm run build

      # House style, checked mechanically on the BUILT output rather than on
      # source, because the dashes that matter are the ones a reader sees and
      # a component can emit one that no source file contains.
      #
      # Both greps are needed. An entity-encoded dash renders identically to a
      # literal one and scores zero on a literal grep, which is how a clean
      # count can be reported for a page full of them.
      #
      # NO `pipefail`, deliberately. grep exits 1 when it finds nothing, which is
      # the PASSING case here. Actions already runs this as `bash -e`, so with
      # pipefail on, a clean build aborted the step before it printed a single
      # count. Without pipefail the pipeline's status is `tr`'s, which is 0, and
      # the counts decide.
      - name: House style gate (no em-dashes, no encoded dashes)
        run: |
          set -u
          literal=$(grep -rohI '—' dist/ | wc -l | tr -d ' ')
          encoded=$(grep -rohIi '&mdash;\|&ndash;\|&#8212;\|&#8211;\|&#x2014;\|&#x2013;' dist/ | wc -l | tr -d ' ')
          echo "literal em-dashes: $literal"
          echo "entity-encoded dashes: $encoded"
          if [ "$literal" != "0" ] || [ "$encoded" != "0" ]; then
            echo "::error::House style gate failed. Offending files:"
            grep -rlI '—' dist/ || true
            grep -rlIi '&mdash;\|&ndash;\|&#8212;\|&#8211;\|&#x2014;\|&#x2013;' dist/ || true
            exit 1
          fi
          echo "House style gate passed."

      - name: Check budget card regression fixtures
        run: node --test scripts/budget-game-card.test.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # After Pages has the new build. The key file is already served from public/
  # (6db086fa92a744fdae08491a16603960.txt). continue-on-error: a failed ping must
  # not mark a successful deploy red. Only on main.
  indexnow:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Notify IndexNow of the live sitemap
        id: indexnow
        continue-on-error: true
        run: python3 scripts/indexnow_ping.py --sitemap

      - name: Report IndexNow outcome
        if: always()
        env:
          INDEXNOW_OUTCOME: ${{ steps.indexnow.outcome }}
        run: |
          case "$INDEXNOW_OUTCOME" in
            success)
              echo "IndexNow: notified." >> "$GITHUB_STEP_SUMMARY" ;;
            failure)
              echo "::warning title=IndexNow failed::The site deployed, but IndexNow was not notified. See the Notify IndexNow step log."
              echo "IndexNow: failed. Pages deployed; search engines were not notified. See the Notify IndexNow step log." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "IndexNow: not run (outcome: ${INDEXNOW_OUTCOME:-none})." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
