name: Data ETL Pipeline

# Manual only since 28 September 2026. No published page reads these feeds, so
# they moved to archive/public/data/ (see archive/README.md) and are no longer
# deployed. The schedule ran twice a day and each commit redeployed the site.
# Run it by hand to refresh the archive; restore the schedule and the public/
# path together if a page starts using the data again.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-etl
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run roadworks ETL
        run: python3 scripts/roadworks_etl.py archive/public/data/roadworks.json
        continue-on-error: true

      - name: Run FixMyStreet ETL
        run: python3 scripts/fixmystreet_etl.py archive/public/data/fixmystreet.json
        continue-on-error: true

      - name: Run LCC highways ETL
        run: python3 scripts/lcc_highways_etl.py archive/public/data/lcc_highways.json
        continue-on-error: true

      - name: Run traffic intelligence ETL
        run: python3 scripts/traffic_etl.py archive/public/data/traffic.json
        continue-on-error: true

      - name: Summary
        run: |
          echo "### Data ETL Results" >> $GITHUB_STEP_SUMMARY
          for f in roadworks fixmystreet lcc_highways traffic; do
            if [ -f "archive/public/data/${f}.json" ]; then
              SIZE=$(wc -c < "archive/public/data/${f}.json" | tr -d ' ')
              echo "- **${f}.json**: ${SIZE} bytes" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **${f}.json**: missing" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet archive/public/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to data files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data files updated:"
            git diff --stat archive/public/data/
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/public/data/roadworks.json archive/public/data/roadworks_archive.json archive/public/data/roadworks_analytics.json archive/public/data/fixmystreet.json archive/public/data/lcc_highways.json archive/public/data/traffic.json
          git commit -m "data: refresh all feeds $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          git push
