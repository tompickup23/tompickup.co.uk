# Dependabot: monthly grouped updates for the ecosystems this repo uses.
# Shape follows clawd/.github/dependabot.yml: monthly, grouped, minor/patch only.
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      npm-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "ci"
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
